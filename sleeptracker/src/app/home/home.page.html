<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      <ion-icon name="moon" size="large"></ion-icon>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header>
    <ion-toolbar>
      <ion-title size="large">Hi John!</ion-title>
      <h1>It is now {{getCurrentTime()}}</h1>
    </ion-toolbar>
  </ion-header>
  <ion-item>
    <!-- Add graph to show the last 7 days of sleep data -->
    <ion-card>
      <ion-card-header>
        <ion-card-title>Last 7 days:</ion-card-title>
        <ion-thumbnail slot="end">
          <ion-icon name="bed-outline"></ion-icon>
        </ion-thumbnail>
        <p>AVERAGE: {{averageSleepDurationLast7Days()}}</p>
      </ion-card-header>
      <ion-card-content>
        <!-- Graph content goes here -->
      </ion-card-content>
    </ion-card>
  </ion-item>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button>
      <ion-icon name="add-circle"></ion-icon>
    </ion-fab-button>
    <ion-fab-list side="top">
      <ion-fab-button (click)="addSleep()">
        <ion-icon name="bed-outline"></ion-icon>
      </ion-fab-button>
      <ion-fab-button (click)="addSleepiness()">
        <ion-icon name="moon-outline"></ion-icon>
      </ion-fab-button>
    </ion-fab-list>
  </ion-fab>

</ion-content>

<ion-footer>
  <ion-tab-bar slot="bottom">
    <ion-tab-button [selected]="true"> 
      <ion-icon name="home"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>
    <ion-tab-button (click)="presentActionSheet($event)">
      <ion-icon name="add-circle"></ion-icon>
      <ion-label>Log</ion-label>
    </ion-tab-button>
    <ion-tab-button routerLink="/sleep-data">
      <ion-icon name="bed-outline"></ion-icon>
      <ion-label>Sleep Data</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="profile">
      <ion-icon name="person-circle"></ion-icon>
      <ion-label>Profile</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-footer>
