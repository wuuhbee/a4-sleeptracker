<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start" (click)="dismissModal()">
      <ion-icon name="close"></ion-icon>
    </ion-buttons>
    <ion-title>Log My Sleep</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logSleep()">Confirm</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-item>
    <ion-label position="stacked">When did you sleep?</ion-label>
    <ion-datetime [(ngModel)]="sleepStart" presentation="date-time" [preferWheel]="true" id="sleepStart" size="fixed"></ion-datetime>
  </ion-item>
  <ion-item>
    <ion-label position="stacked">When did you wake up?</ion-label>
    <ion-datetime [(ngModel)]="sleepEnd" presentation="date-time" [preferWheel]="true" id="sleepEnd" size="fixed"></ion-datetime>
  </ion-item>
  <ion-item>
    <ion-label position="stacked">How many times did you wake up during the night?</ion-label>
    <ion-input type="number" [(ngModel)]="wakeCount" id="wakeCount" placeholder="Enter number of times"></ion-input>
  </ion-item>

</ion-content>
