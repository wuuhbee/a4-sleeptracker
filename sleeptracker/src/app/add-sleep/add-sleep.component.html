<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start" (click)="dismissModal()">
      <ion-icon name="close"></ion-icon>
    </ion-buttons>
    <ion-title>Log My Sleep</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logSleep()">Confirm</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-item>
    <ion-label position="stacked">When did you sleep?</ion-label>
    <ion-datetime-button datetime="sleepStartDatetime"></ion-datetime-button>
    <ion-modal [keepContentsMounted]="true">
      <ng-template>
        <ion-datetime id="sleepStartDatetime" [(ngModel)]="sleepStart"></ion-datetime>
      </ng-template>
    </ion-modal>
  </ion-item>
  <ion-item>
    <ion-label position="stacked">When did you wake up?</ion-label>
    <ion-datetime-button datetime="sleepEndDatetime"></ion-datetime-button>
    <ion-modal [keepContentsMounted]="true">
      <ng-template>
        <ion-datetime id="sleepEndDatetime" [(ngModel)]="sleepEnd"></ion-datetime>
      </ng-template>
    </ion-modal>

  </ion-item>
  <ion-item>
    <ion-label position="stacked">How many times did you wake up during the night?</ion-label>
    <ion-input type="number" [(ngModel)]="wakeCount" id="wakeCount" placeholder="Enter number of times"></ion-input>
  </ion-item>

</ion-content>
